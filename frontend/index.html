<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Climate Impact On Crop Yield Prediction</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<div class="container">

    <h1>Climate Impact On Crop Yield Prediction</h1>

    <p class="description">
        Predict crop yield using climate and agricultural conditions.
    </p>


    <form id="predictionForm">

        <!-- Area Dropdown -->

        <label for="area">Area</label>

        <select id="area" required>

            <option value="">
                Loading areas...
            </option>

        </select>


        <!-- Crop Dropdown -->

        <label for="crop">Crop</label>

        <select id="crop" required>

            <option value="">
                Loading crops...
            </option>

        </select>


        <label for="rainfall">
            Average Rainfall (mm/year)
        </label>

        <input
            type="number"
            id="rainfall"
            placeholder="Enter rainfall (e.g., 1500)"
            required
        >


        <label for="pesticides">
            Pesticides (tonnes)
        </label>

        <input
            type="number"
            id="pesticides"
            placeholder="Enter pesticides (e.g., 500)"
            required
        >


        <label for="temperature">
            Average Temperature (°C)
        </label>

        <input
            type="number"
            id="temperature"
            step="any"
            placeholder="Enter temperature (e.g., 25)"
            required
        >


        <button type="submit">
            Predict Yield
        </button>

    </form>


    <div id="result" class="result"></div>

</div>


<script src="script.js"></script>
```

</body>

</html>
